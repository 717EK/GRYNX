<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>GRYNX — Track. Sync. Execute.</title>
    <meta name="description" content="GRYNX production workflow system by D-LYFT." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply saved theme/mode before first paint to avoid a flash.
      (function () {
        try {
          var mode = localStorage.getItem('grynx-mode') || 'light';
          document.documentElement.dataset.mode = mode;
          var themes = { amber: ['#f5a623', '#0a0a0a'], azure: ['#3b82f6', '#fff'], cyan: ['#22d3ee', '#04181c'], lime: ['#84cc16', '#0a1404'], violet: ['#8b7cf6', '#0b0820'], rose: ['#fb7185', '#1a0508'] };
          var t = themes[localStorage.getItem('grynx-theme') || 'amber'] || themes.amber;
          document.documentElement.style.setProperty('--brand', t[0]);
          document.documentElement.style.setProperty('--on-brand', t[1]);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
