<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>GRYNX — Track. Sync. Execute.</title>
    <meta name="description" content="GRYNX production workflow system by D-LYFT." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply saved theme/mode before first paint to avoid a flash.
      (function () {
        try {
          var mode = localStorage.getItem('grynx-mode') || 'light';
          document.documentElement.dataset.mode = mode;
          var themes = { amber: ['#f5a623', '#0a0a0a'], azure: ['#3b82f6', '#fff'], cyan: ['#22d3ee', '#04181c'], lime: ['#84cc16', '#0a1404'], violet: ['#8b7cf6', '#0b0820'], rose: ['#fb7185', '#1a0508'] };
          var t = themes[localStorage.getItem('grynx-theme') || 'amber'] || themes.amber;
          document.documentElement.style.setProperty('--brand', t[0]);
          document.documentElement.style.setProperty('--on-brand', t[1]);
        } catch (e) {}
      })();
      // Device-fit: size the whole UI to this phone's real estate, once on load
      // and again only on rotation/resize. Baseline design = 390×844 (iPhone).
      // --scale drives the root font + hero/spacing math so every page fits the
      // screen it's opened on, regardless of device resolution.
      (function () {
        var root = document.documentElement;
        function fit() {
          var w = window.innerWidth, h = window.innerHeight;
          var s = Math.min(w / 390, h / 844);
          s = Math.max(0.85, Math.min(s, 1.4));
          root.style.setProperty('--scale', s.toFixed(4));
          root.style.setProperty('--vh', h / 100 + 'px');
          root.style.setProperty('--vw', w / 100 + 'px');
          root.style.fontSize = (16 * s).toFixed(2) + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', fit);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
