<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GRYNX — Track. Sync. Execute.</title>
    <meta name="description" content="GRYNX production workflow system by D-LYFT." />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        min-height: 100dvh; display: grid; place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #15181d 0%, #0b0d10 60%);
        color: #e8eaed; text-align: center; padding: 24px;
      }
      .wrap { max-width: 540px; }
      .brand { font-size: clamp(48px, 12vw, 96px); font-weight: 800; letter-spacing: 0.04em; }
      .tag { margin-top: 8px; font-size: clamp(14px, 4vw, 20px); letter-spacing: 0.28em;
             text-transform: uppercase; color: #9aa0a6; }
      .by { margin-top: 28px; font-size: 13px; color: #6b7177; letter-spacing: 0.1em; }
      .status { margin-top: 36px; display: inline-block; padding: 8px 16px; border-radius: 999px;
                border: 1px solid #2a2f36; color: #b6bbc1; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">GRYNX</div>
      <div class="tag">Track · Sync · Execute</div>
      <div class="status">Pilot in setup — architecture phase</div>
      <div class="by">by D-LYFT</div>
    </main>
  </body>
</html>
