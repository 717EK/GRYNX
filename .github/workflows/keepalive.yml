name: keep-alive
# Pings the API /health so Render's free tier doesn't sleep (which causes the
# slow first login). GitHub's scheduled runs can drift a few minutes; if you
# want rock-solid timing, also add a free UptimeRobot monitor on the same URL.
on:
  schedule:
    - cron: '*/10 * * * *' # ~every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 90 https://grynx-api.onrender.com/health || true
